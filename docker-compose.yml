services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guestbook_app
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "9000:9000" # Ekspos PHP-FPM ke host agar bisa diakses Nginx host
    volumes:
      - .:/var/www
      - /var/www/public/build  # Jaga hasil build Vite dari Dockerfile, tidak ditimpa volume mount
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - guestbook
    depends_on:
      - db

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: guestbook_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-guestbook}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Port tidak diekspos ke host — hanya dapat diakses oleh container di network 'guestbook'
    # Uncomment baris berikut jika perlu akses langsung dari host (misal: DBeaver, TablePlus):
    # ports:
    #   - "${DB_PORT:-5432}:5432"
    networks:
      - guestbook

  # ─── Queue Worker ──────────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guestbook_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - guestbook


volumes:
  pgdata:
    driver: local

networks:
  guestbook:
    driver: bridge